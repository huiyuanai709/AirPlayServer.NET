name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install Native AOT build tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore AirPlayServer.slnx

      - name: Build
        run: dotnet build AirPlayServer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AirPlayServer.slnx --configuration Release --no-build --verbosity normal

      - name: Check the release zip omits debug symbols
        run: ./packaging/stage-release-test.sh

      - name: Native AOT publish (linux-x64 lean)
        run: ./packaging/publish.sh linux-x64 Release lean

      - name: Smoke the lean binary
        run: |
          set -euo pipefail
          artifacts/linux-x64/AirPlayServer.Host --help
          artifacts/linux-x64/AirPlayServer.Host --self-check
          artifacts/linux-x64/AirPlayServer.Host --help | grep -F "构建: lean"

      - name: Native AOT publish (linux-x64 ui)
        run: ./packaging/publish.sh linux-x64 Release ui

      - name: Smoke the ui binary
        run: |
          set -euo pipefail
          artifacts/linux-x64-ui/AirPlayServer.Host --help
          artifacts/linux-x64-ui/AirPlayServer.Host --self-check
          artifacts/linux-x64-ui/AirPlayServer.Host --help | grep -F "构建: ui"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Native AOT publish (osx-arm64 lean)
        run: ./packaging/publish.sh osx-arm64 Release lean

      - name: Smoke the lean binary
        run: |
          set -euo pipefail
          artifacts/osx-arm64/AirPlayServer.Host --help
          artifacts/osx-arm64/AirPlayServer.Host --self-check
          artifacts/osx-arm64/AirPlayServer.Host --help | grep -F "构建: lean"

      - name: Native AOT publish (osx-arm64 ui)
        run: ./packaging/publish.sh osx-arm64 Release ui

      - name: Smoke the ui binary
        run: |
          set -euo pipefail
          artifacts/osx-arm64-ui/AirPlayServer.Host --help
          artifacts/osx-arm64-ui/AirPlayServer.Host --self-check
          artifacts/osx-arm64-ui/AirPlayServer.Host --help | grep -F "构建: ui"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Test
        run: dotnet test AirPlayServer.slnx --configuration Release --verbosity normal

      - name: Check the release zip omits debug symbols
        shell: bash
        run: ./packaging/stage-release-test.sh

      - name: Native AOT publish (win-x64 lean)
        run: ./packaging/publish.ps1 -Runtime win-x64 -Flavor lean

      - name: Smoke the lean binary
        shell: pwsh
        run: |
          ./artifacts/win-x64/AirPlayServer.Host.exe --help
          ./artifacts/win-x64/AirPlayServer.Host.exe --self-check
          if (-not (./artifacts/win-x64/AirPlayServer.Host.exe --help | Select-String -SimpleMatch "构建: lean")) { exit 1 }

      - name: Native AOT publish (win-x64 ui)
        run: ./packaging/publish.ps1 -Runtime win-x64 -Flavor ui

      - name: Smoke the ui binary
        shell: pwsh
        run: |
          ./artifacts/win-x64-ui/AirPlayServer.Host.exe --help
          ./artifacts/win-x64-ui/AirPlayServer.Host.exe --self-check
          if (-not (./artifacts/win-x64-ui/AirPlayServer.Host.exe --help | Select-String -SimpleMatch "构建: ui")) { exit 1 }
