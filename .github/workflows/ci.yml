name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install Native AOT build tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore AirPlayServer.slnx

      - name: Build
        run: dotnet build AirPlayServer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AirPlayServer.slnx --configuration Release --no-build --verbosity normal

      - name: Check the release zip omits debug symbols
        run: ./packaging/stage-release-test.sh

      - name: Native AOT publish (linux-x64)
        run: ./packaging/publish.sh linux-x64

      - name: Avalonia native libraries are in the linux publish
        run: |
          set -euo pipefail
          found=$(find artifacts/linux-x64 -type f \( -name '*.so' -o -name '*.so.*' \) | wc -l)
          if [ "$found" -lt 1 ]; then
            echo "linux-x64 publish has no Avalonia/Skia native library" >&2
            find artifacts/linux-x64 -type f >&2
            exit 1
          fi
          find artifacts/linux-x64 -type f \( -name '*.so' -o -name '*.so.*' \)

      - name: Smoke the published binary
        run: |
          artifacts/linux-x64/AirPlayServer.Host --help
          artifacts/linux-x64/AirPlayServer.Host --self-check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Native AOT publish (osx-arm64)
        run: ./packaging/publish.sh osx-arm64

      - name: Avalonia native libraries are in the macOS publish
        run: |
          set -euo pipefail
          found=$(find artifacts/osx-arm64 -type f -name '*.dylib' | wc -l)
          if [ "$found" -lt 1 ]; then
            echo "osx-arm64 publish has no Avalonia native library" >&2
            find artifacts/osx-arm64 -type f >&2
            exit 1
          fi

      - name: Smoke the published binary
        run: |
          artifacts/osx-arm64/AirPlayServer.Host --help
          artifacts/osx-arm64/AirPlayServer.Host --self-check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Test
        run: dotnet test AirPlayServer.slnx --configuration Release --verbosity normal

      - name: Check the release zip omits debug symbols
        shell: bash
        run: ./packaging/stage-release-test.sh

      - name: Native AOT publish (win-x64)
        run: ./packaging/publish.ps1 -Runtime win-x64

      - name: Smoke the published binary
        shell: pwsh
        run: |
          ./artifacts/win-x64/AirPlayServer.Host.exe --help
          ./artifacts/win-x64/AirPlayServer.Host.exe --self-check
