name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.2.0 或 v0.2.0。预发布用 0.2.0-rc.1。"
        required: true
        type: string
      dry_run:
        description: "只构建并上传 Actions 产物，不创建 tag 或 GitHub Release"
        required: false
        type: boolean
        default: false

# Publish jobs only read the repo. The release job writes the tag and Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.version || 'none' }}-${{ github.event.inputs.dry_run || 'false' }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and check the version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$value" in
              *[!A-Za-z0-9._-]*)
                echo "unsafe resolver value for ${key}" >&2
                exit 1
                ;;
            esac
            case "$key" in
              tag|version|prerelease)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                printf '%s=%s\n' "$key" "$value"
                ;;
              *)
                echo "unexpected resolver output: $line" >&2
                exit 1
                ;;
            esac
          done < <(./packaging/resolve-release-version.sh)
          for key in tag version prerelease; do
            if ! grep -q "^${key}=" "$GITHUB_OUTPUT"; then
              echo "resolver did not set ${key}" >&2
              exit 1
            fi
          done

  publish:
    name: Publish ${{ matrix.rid }} ${{ matrix.flavor }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest already has the VS 2022 C++ toolset Native AOT links with.
          - os: windows-latest
            rid: win-x64
            flavor: lean
          - os: windows-latest
            rid: win-x64
            flavor: ui
          - os: ubuntu-latest
            rid: linux-x64
            flavor: lean
          - os: ubuntu-latest
            rid: linux-x64
            flavor: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install Native AOT build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Native AOT publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          FLAVOR: ${{ matrix.flavor }}
          PUBLISH_VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_INFORMATIONAL_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./packaging/publish.sh "$RID" Release "$FLAVOR"

      - name: Smoke the published binary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$FLAVOR" = "ui" ]; then
            suffix="-ui"
          fi
          if [ "$RID" = "win-x64" ]; then
            bin="artifacts/${RID}${suffix}/AirPlayServer.Host.exe"
          else
            bin="artifacts/${RID}${suffix}/AirPlayServer.Host"
          fi
          "$bin" --help
          "$bin" --self-check
          "$bin" --help | grep -F "构建: ${FLAVOR}"

      - name: Pack the release zip
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          FLAVOR: ${{ matrix.flavor }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$FLAVOR" = "ui" ]; then
            suffix="-ui"
          fi
          ./packaging/stage-release.sh \
            "$RID" \
            "$TAG" \
            "artifacts/${RID}${suffix}" \
            "artifacts/release/AirPlayServer.Host-${TAG}-${RID}${suffix}.zip" \
            "$FLAVOR"

      - uses: actions/upload-artifact@v4
        with:
          name: AirPlayServer.Host-${{ matrix.rid }}${{ matrix.flavor == 'ui' && '-ui' || '' }}
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [version, publish]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: AirPlayServer.Host-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          linux="AirPlayServer.Host-${TAG}-linux-x64.zip"
          linux_ui="AirPlayServer.Host-${TAG}-linux-x64-ui.zip"
          windows="AirPlayServer.Host-${TAG}-win-x64.zip"
          windows_ui="AirPlayServer.Host-${TAG}-win-x64-ui.zip"
          test -f "dist/$linux"
          test -f "dist/$linux_ui"
          test -f "dist/$windows"
          test -f "dist/$windows_ui"
          (
            cd dist
            sha256sum "$linux" "$linux_ui" "$windows" "$windows_ui" > SHA256SUMS.txt
          )
          ./packaging/release-notes.sh "$TAG" > dist/notes.md

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ./packaging/publish-github-release.sh \
            "$TAG" \
            "$RELEASE_SHA" \
            "$PRERELEASE" \
            dist/notes.md \
            "dist/AirPlayServer.Host-${TAG}-linux-x64.zip" \
            "dist/AirPlayServer.Host-${TAG}-linux-x64-ui.zip" \
            "dist/AirPlayServer.Host-${TAG}-win-x64.zip" \
            "dist/AirPlayServer.Host-${TAG}-win-x64-ui.zip" \
            dist/SHA256SUMS.txt
